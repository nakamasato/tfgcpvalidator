version: 2

project_name: tfgcpvalidator

builds:
  - id: tfgcpvalidator
    main: ./cmd/tfgcpvalidator
    binary: tfgcpvalidator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  # The composite action builds this exact filename, so changing the template
  # breaks every pinned action version.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

# release-please owns the release and its notes, so goreleaser only attaches
# artifacts to what already exists.
release:
  mode: append

changelog:
  disable: true
