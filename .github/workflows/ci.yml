name: ci

on:
  push:
    branches:
      - main
  pull_request:
    # labeled is here so that applying test-action to an open pull request
    # reruns the action job, which is what posts the comment.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint the action scripts
        run: shellcheck scripts/*.sh

      - name: Test the action scripts
        run: bash scripts/comment_test.sh

  # Runs the action on itself, so a break in the action wiring shows up here
  # rather than in someone else's pipeline after a release.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The action uses a tfgcpvalidator already on PATH in preference to
      # downloading a release, so the comment on this pull request shows what
      # the branch renders rather than what the last release did.
      - name: Build the binary under test
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bin"
          mkdir -p "$dir"
          go build -o "$dir/tfgcpvalidator" ./cmd/tfgcpvalidator
          echo "$dir" >> "$GITHUB_PATH"

      - id: validate
        uses: ./
        with:
          plan: internal/check/destroy/testdata/schema_shaped_plan.json
          fail-on: never
          # The comment lands on this pull request for real, so it is opt-in per
          # pull request: label one test-action to see what the branch renders.
          # Everything else about the action is exercised either way.
          comment: ${{ contains(github.event.pull_request.labels.*.name, 'test-action') }}

      - name: Check the outputs
        env:
          ERRORS: ${{ steps.validate.outputs.error-count }}
        run: |
          set -euo pipefail
          # The exact count moves whenever the fixture is regenerated against a
          # newer provider, so only the fact that the fixture still trips the
          # check is worth asserting here.
          if [ -z "$ERRORS" ] || [ "$ERRORS" -lt 1 ]; then
            echo "expected the fixture plan to produce errors, got: '$ERRORS'" >&2
            exit 1
          fi
