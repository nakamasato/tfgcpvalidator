name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A GitHub App token, not GITHUB_TOKEN. GITHUB_TOKEN cannot open pull
      # requests unless the repository opts in, and nothing it does raises
      # events — which would leave the release pull request without CI and,
      # worse, would never fire release.yml when the release is published.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Maintains a release pull request from the conventional commits on main.
      # Merging it is what cuts a version: this tags it and publishes the
      # release, and release.yml takes over from there.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
